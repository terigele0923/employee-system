<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>スキル編集 | 社員管理システム</title>
    <link rel="stylesheet"
          th:href="@{/css/bootstrap.min.css}">
</head>

<body class="bg-light">

    <header th:replace="~{fragments/header :: header('employees')}"></header>

    <nav class="bg-white border-bottom"
         aria-label="従業員詳細メニュー">

        <div class="container-fluid px-4">
            <ul class="nav nav-tabs border-bottom-0">

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/employees/{employeeId}(
                            employeeId=${employee.employeeId}
                       )}">
                        基本情報
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active"
                       aria-current="page"
                       th:href="@{/employees/{employeeId}/skills(
                            employeeId=${employee.employeeId}
                       )}">
                        スキル一覧
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/employees/{employeeId}/assignments(
                            employeeId=${employee.employeeId}
                       )}">
                        参加案件一覧
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/employees/{employeeId}/interviews(
                            employeeId=${employee.employeeId}
                       )}">
                        面談履歴
                    </a>
                </li>

            </ul>
        </div>
    </nav>

    <main class="container-fluid px-4 py-4">

        <div class="mb-4">
            <h1 class="h3 mb-1">
                スキル編集
            </h1>

            <p class="text-secondary mb-0">
                <span th:text="${employee.employeeNo}">
                    E000000001
                </span>

                <span class="mx-2">｜</span>

                <span th:text="${employee.employeeName}">
                    従業員名
                </span>
            </p>
        </div>

        <div class="card border-0 shadow-sm">

            <div class="card-header bg-white px-4 py-3">
                <h2 class="h5 mb-0">
                    スキル情報
                </h2>
            </div>

            <div class="card-body p-4">

                <form th:action="@{/employees/{employeeId}/skills/{employeeSkillId}/edit(
                            employeeId=${employee.employeeId},
                            employeeSkillId=${employeeSkillId}
                       )}"
                      th:object="${employeeSkillRequest}"
                      method="post">

                    <div class="row g-4">

                        <div class="col-12 col-md-6">

                            <label for="skillId"
                                   class="form-label">
                                スキル
                                <span class="text-danger">*</span>
                            </label>

                            <select id="skillId"
                                    class="form-select"
                                    th:field="*{skillId}"
                                    th:errorclass="is-invalid"
                                    required>

                                <option value="">
                                    選択してください
                                </option>

                                <option th:each="skill : ${skillOptions}"
                                        th:value="${skill.skillId}"
                                        th:text="${skill.skillName}">
                                    Java
                                </option>

                            </select>
							
							                            <div class="invalid-feedback"
							                                 th:errors="*{skillId}">
							                                スキルを選択してください。
							                            </div>

							                        </div>

							                        <div class="col-12 col-md-6">

							                            <label for="experienceMonths"
							                                   class="form-label">
							                                経験月数
							                                <span class="text-danger">*</span>
							                            </label>

							                            <div class="input-group">

							                                <input id="experienceMonths"
							                                       type="number"
							                                       class="form-control"
							                                       th:field="*{experienceMonths}"
							                                       th:errorclass="is-invalid"
							                                       min="0"
							                                       max="9999"
							                                       required>

							                                <span class="input-group-text">
							                                    か月
							                                </span>

							                                <div class="invalid-feedback"
							                                     th:errors="*{experienceMonths}">
							                                    経験月数を入力してください。
							                                </div>

							                            </div>
							                        </div>

							                        <div class="col-12 col-md-6">

							                            <label for="skillLevel"
							                                   class="form-label">
							                                スキルレベル
							                                <span class="text-danger">*</span>
							                            </label>

							                            <select id="skillLevel"
							                                    class="form-select"
							                                    th:field="*{skillLevel}"
							                                    th:errorclass="is-invalid"
							                                    required>

							                                <option value="">
							                                    選択してください
							                                </option>
							                                <option value="1">1</option>
							                                <option value="2">2</option>
							                                <option value="3">3</option>
							                                <option value="4">4</option>
							                                <option value="5">5</option>

							                            </select>

							                            <div class="invalid-feedback"
							                                 th:errors="*{skillLevel}">
							                                スキルレベルを選択してください。
							                            </div>

							                        </div>

							                        <div class="col-12 col-md-6">

							                            <label for="lastUsedYm"
							                                   class="form-label">
							                                最終使用年月
							                            </label>

							                            <input id="lastUsedYm"
							                                   name="lastUsedYm"
							                                   type="month"
							                                   class="form-control"
							                                   th:classappend="${#fields.hasErrors('lastUsedYm')}
							                                        ? 'is-invalid'"
							                                   th:value="${employeeSkillRequest.lastUsedYm != null
							                                        and employeeSkillRequest.lastUsedYm.length() == 6
							                                        ? employeeSkillRequest.lastUsedYm.substring(0, 4)
							                                          + '-'
							                                          + employeeSkillRequest.lastUsedYm.substring(4, 6)
							                                        : employeeSkillRequest.lastUsedYm}">

							                            <div class="form-text">
							                                年月を選択してください。
							                            </div>

							                            <div class="invalid-feedback"
							                                 th:errors="*{lastUsedYm}">
							                                最終使用年月を確認してください。
							                            </div>

							                        </div>

							                        <div class="col-12">

							                            <label for="remarks"
							                                   class="form-label">
							                                備考
							                            </label>

							                            <textarea id="remarks"
							                                      class="form-control"
							                                      th:field="*{remarks}"
							                                      th:errorclass="is-invalid"
							                                      rows="4"
							                                      maxlength="500"></textarea>

							                            <div class="form-text">
							                                500文字以内で入力してください。
							                            </div>

							                            <div class="invalid-feedback"
							                                 th:errors="*{remarks}">
							                                備考を確認してください。
							                            </div>

							                        </div>

							                    </div>

							                    <div class="d-flex justify-content-end gap-2 mt-4">

							                        <a class="btn btn-outline-secondary"
							                           th:href="@{/employees/{employeeId}/skills(
							                                employeeId=${employee.employeeId}
							                           )}">
							                            キャンセル
							                        </a>

							                        <button type="submit"
							                                class="btn btn-primary">
							                            更新
							                        </button>

							                    </div>

							                </form>

							            </div>
							        </div>

							    </main>

							    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>

							</body>

							</html>
