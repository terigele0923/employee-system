<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ダッシュボード | 社員管理システム</title>
	<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="bg-light">
	
	<header th:replace="~{fragments/header :: header('dashboard')}"></header>

	<main class="container-fluid px-4 py-4">

		<div class="mb-4">
			<h1 class="h3 mb-1">ダッシュボード画面</h1>
			<p class="text-secondary mb-0">
				権限：
				<span th:text="${loginUser.roleName}">
					権限
				</span>
			</p>
		</div>
		<section aria-labelledby="summary-heading">

			<h2 id="summary-heading" class="h5 mb-3">
				稼働状況
			</h2>

			<div class="row g-4 mb-3">

				<div class="col-12 col-sm-6 col-lg-3">
					<div class="card border-0 shadow-sm h-100">
						<div class="card-body">
							<p class="text-secondary fw-bold mb-2">
								待機中人数
							</p>

							<a th:href="@{/employees(
								employmentStatus='01',
								workStatus='01'
							)}"
							class="text-primary text-decoration-none">
								<span class="fs-1 fw-bold"
									th:text="${dashboard.waitingEmployeeCount}">
									0
								</span>
								<span class="fs-5 fw-normal">
									人
								</span>
							</a>
						</div>
					</div>
				</div>

				<div class="col-12 col-sm-6 col-lg-3">
					<div class="card border-0 shadow-sm h-100">
						<div class="card-body">
							<p class="text-secondary fw-bold  mb-2">
								案件参加人数
							</p>

							<a th:href="@{/employees(
								employmentStatus='01',
								workStatus='03'
							)}"
							class="text-primary text-decoration-none">
								<span class="fs-1 fw-bold"
									th:text="${dashboard.ActiveEmployeeCount}">
									0
								</span>
								<span class="fs-5 fw-normal">
									人
								</span>
							</a>
						</div>
					</div>
				</div>

				<div class="col-12 col-sm-6 col-lg-3">
					<div class="card border-0 shadow-sm h-100">
						<div class="card-body">
							<p class="text-secondary fw-bold  mb-2">
								契約終了30日以内
							</p>

							<a th:href="@{/employees(
								employmentStatus='01',
								workStatus='03',
								contractEndingWithin30Days=true
							)}"
							class="text-danger text-decoration-none">
								<span class="fs-1 fw-bold"
									th:text="${dashboard.endingSoonEmployeeCount}">
									0
								</span>
								<span class="fs-5 fw-normal">
									人
								</span>
							</a>
						</div>
					</div>
				</div>

				<div class="col-12 col-sm-6 col-lg-3">
					<div class="card border-0 shadow-sm h-100">
						<div class="card-body">
							<p class="text-secondary fw-bold  mb-2">
								募集案件
							</p>

							<a th:href="@{/employees(
								employmentStatus='01',
								workStatus='01'
							)}"
							class="text-primary text-decoration-none">
								<span class="fs-1 fw-bold"
									th:text="${dashboard.openProjectCount}">
									0
								</span>
								<span class="fs-5 fw-normal">
									件
								</span>
							</a>
						</div>
					</div>
				</div>

			</div>
		</section>
		
	</main>

	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
