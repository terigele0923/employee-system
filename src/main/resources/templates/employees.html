<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>従業員一覧 | 社員管理システム</title>
    <link rel="stylesheet"
          th:href="@{/css/bootstrap.min.css}">
	<link rel ="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="bg-light">

	<header th:replace="~{fragments/header:: header('employees')}"></header>

    <main class="container-fluid px-4 py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1">従業員一覧</h1>
                <p class="text-secondary mb-0"
                   th:if="${employmentStatus == '01' and workStatus == '01'}">
                    在籍中かつ待機中の従業員
                </p>
            </div>

            <div class="d-flex gap-2">
                <a class="btn btn-success"
                   th:href="@{/employees/new}">
                    新規登録
                </a>

                <a class="btn btn-outline-secondary"
                   th:href="@{/dashboard}">
                    ダッシュボードへ戻る
                </a>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="px-4 py-3">従業員番号</th>
                                <th class="py-3">氏名</th>
                                <th class="py-3">最寄駅</th>
                                <th class="py-3">雇用状態</th>
                                <th class="py-3">稼働状態</th>
                                <th class="px-4 py-3">営業担当者</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="employee : ${employees}"
								th:classappend="${employee.remainingDays !=null and employee.remainingDays lt 0}
								? 'table-danger'
								:(${employee.remainingDays != null and employee.remainingDays le 30}
									? 'table-warning'
									: '')">
                                <td class="px-4"
                                    th:text="${employee.employeeNo}">
                                    E000000001
                                </td>
                                <td>
                                    <a th:href="@{/employees/{employeeId}(
                                            employeeId=${employee.employeeId}
                                        )}"
                                       th:text="${employee.employeeName}"
                                       class="link-primary text-decoration-none fw-semibold">
                                        従業員名
                                    </a>
                                </td>
                                <td th:text="${employee.nearestStation}">
                                    最寄駅
                                </td>
                                <td>
                                    <span th:text="${employee.employmentStatusName}"
                                          class="badge status-badge"
                                          th:classappend="${employee.employmentStatus == '01'} ? 'text-bg-success' : 'text-bg-secondary'">
                                        在籍状態
                                    </span>
                                </td>
                                <td>
                                    <span th:text="${employee.workStatusName}"
                                          class="badge status-badge "
                                          th:classappend="${employee.workStatus == '01'} ? 'text-bg-warning' : 'text-bg-primary'">
                                        稼働状態
                                    </span>
                                </td>
                                <td class="px-4"
                                    th:text="${employee.salesUserName}">
                                    営業担当者
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(employees)}">
                                <td colspan="6"
                                    class="text-center text-secondary py-5">
                                    対象となる従業員はいません。
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>

</html>
