<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>従業員詳細 | 社員管理システム</title>
    <link rel="stylesheet"
          th:href="@{/css/bootstrap.min.css}">
</head>

<body class="bg-light">

    <header class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand mb-0 h1 text-decoration-none"
               th:href="@{/dashboard}">
                社員管理システム
            </a>

            <div class="d-flex align-items-center gap-3">
                <span class="text-white">
                    <span th:text="${loginUser.userName}">
                        ユーザー名
                    </span>
                    さん
                </span>

                <form th:action="@{/logout}"
                      method="post">
                    <button type="submit"
                            class="btn btn-outline-light btn-sm">
                        ログアウト
                    </button>
                </form>
            </div>
        </div>
    </header>

    <main class="container-fluid px-4 py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1">従業員詳細</h1>
                <p class="text-secondary mb-0"
                   th:text="${employee.employeeNo}">
                    E000000001
                </p>
            </div>

            <div class="d-flex gap-2">
                <a class="btn btn-primary"
                   th:href="@{/employees/{employeeId}/edit(
                        employeeId=${employee.employeeId}
                   )}">
                    編集
                </a>

                <a class="btn btn-outline-secondary"
                   th:href="@{/employees(
                        employmentStatus='01',
                        workStatus='01'
                   )}">
                    キャンセル
                </a>

                <form th:if="${loginUser.roleCode == 'ADMIN'}"
                      th:action="@{/employees/{employeeId}/delete(
                            employeeId=${employee.employeeId}
                      )}"
                      method="post"
                      onsubmit="return confirm('この従業員を削除しますか？');">
                    <button type="submit"
                            class="btn btn-danger">
                        削除
                    </button>
                </form>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white px-4 py-3">
                <h2 class="h5 mb-0"
                    th:text="${employee.employeeName}">
                    従業員名
                </h2>
            </div>

            <div class="card-body p-4">
                <div class="row g-4">
                    <div class="col-12 col-md-6">
                        <div class="text-secondary small mb-1">従業員番号</div>
                        <div th:text="${employee.employeeNo}">
                            E000000001
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="text-secondary small mb-1">氏名</div>
                        <div th:text="${employee.employeeName}">
                            従業員名
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="text-secondary small mb-1">生年月日</div>
                        <div th:text="${employee.birthDate}">
                            2000-01-01
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="text-secondary small mb-1">電話番号</div>
                        <div th:text="${employee.phoneNo}">
                            000-0000-0000
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="text-secondary small mb-1">郵便番号</div>
                        <div th:text="${employee.postalCode != null ? employee.postalCode : '-'}">
                            000-0000
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="text-secondary small mb-1">住所</div>
                        <div th:text="${employee.address}">
                            住所
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="text-secondary small mb-1">最寄駅</div>
                        <div th:text="${employee.nearestStation}">
                            最寄駅
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="text-secondary small mb-1">入社日</div>
                        <div th:text="${employee.joinDate}">
                            2020-01-01
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="text-secondary small mb-1">雇用状態</div>
                        <div>
                            <span th:text="${employee.employmentStatusName}"
                                  class="badge"
                                  th:classappend="${employee.employmentStatus == '01'} ? 'text-bg-success' : 'text-bg-secondary'">
                                在籍状態
                            </span>
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="text-secondary small mb-1">稼働状態</div>
                        <div>
                            <span th:text="${employee.workStatusName}"
                                  class="badge"
                                  th:classappend="${employee.workStatus == '01'} ? 'text-bg-warning' : 'text-bg-primary'">
                                稼働状態
                            </span>
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="text-secondary small mb-1">営業担当者</div>
                        <div th:text="${employee.salesUserName}">
                            営業担当者
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="text-secondary small mb-1">備考</div>
                        <div class="border rounded bg-light p-3"
                             th:text="${employee.remarks != null and !employee.remarks.isEmpty() ? employee.remarks : '-'}">
                            備考
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>

</html>
