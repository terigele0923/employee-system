<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport"
	content="width=device-width,initial-scle=1">
	
<title>スキル一覧 | 社員管理システム</title>
<link rel="stylesheet"
	th:href="@{/css/bootstrap.min.css}">
</head>

<body class="bg-light">
	
	<header th:replace="~{fragments/header::header('employees')}"></header>
	
	<nav class="bg-white border-bottom"
		aria-label="従業員詳細メニュー">
		<div class="container-fluid px-4">
			<ul class="nav nav-tabs border-bottom-0">
				
				<li class="nav-item">
					<a class="nav-link"
						th:href="@{/employees/{employeeId}(
							employeeId=${employee.employeeId}
						)}">
						基本情報
					</a>
				</li>
				<li class="nav-item">
					<a class="nav-link active"
						aria-current="page"
						th:href="@{/employees/{employeeId}/skills(
							employeeId=${employee.employeeId}
						)}">
						スキル一覧
					</a>
				</li>
				<li class="nav-item">
					<a class="nav-link"
						th:href="@{/employees/{employeeId}/assignments(
							employeeId=${employee.employeeId}
						)}">
						参加案件一覧
					</a>
				</li>
				<li class="nav-item">
					<a class="nav-link"
						th:href="@{/employees/{employeeId}/interviews(
							employeeId=${employee.employeeId}
						)}">
						面談履歴一覧
					</a>
				</li>
				
				
			</ul>
		</div>
	</nav>
	
	<main class="container-fluid px-4 py-4">
		
		<div class="mb-4">
			<h1 class="h3 mb-1">スキル一覧</h1>
			
			<p class="text-secondary mb-0">
				<span th:text="${employee.employeeNo}">
					E000000001
				</span>
				<span class="mx-2">|</span>
				<span th:text="${employee.employeeName}">
					従業員名
				</span>
			</p>
		</div>
		
		<div class="card border-0 shadow-sm">
			<div class="card-header bg-white px-4 py-3">
				<h2 class="h5 mb-0">登録済みスキル</h2>
			</div>
			
			<div class="card-body p-4">
				<p class="text-secondary mb-0">
					スキル一覧は次の工程で表示します。
				</p>
			</div>
		</div>
	</main>
	
	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
